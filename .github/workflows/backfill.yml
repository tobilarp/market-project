name: Backfill history (one-off)

# Run by hand from the Actions tab. Free Alpha Vantage allows 25 calls a day
# and there are 26 funds, so run it today and again tomorrow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch earlier closes
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: python backfill.py
      - name: Rebuild dashboard
        run: python build.py
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backfill.json index.html
          git diff --staged --quiet || git commit -m "Backfill earlier closes"
          git pull --rebase
          git push
